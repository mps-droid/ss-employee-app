apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

react {
    autolinkLibrariesWithApp()
}

/**
 * R8 shrinks and obfuscates the Java and Kotlin code in release builds. Its mapping file
 * goes into the app bundle, so Play Console can deobfuscate crash and ANR reports.
 */
def enableProguardInReleaseBuilds = true

/**
 * The JavaScriptCore flavour, used only when Hermes is turned off in gradle.properties.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Release signing values live outside git, in android/signing/signing.properties.
def signingPropertiesFile = rootProject.file("signing/signing.properties")
def signingProperties = new Properties()
if (signingPropertiesFile.exists()) {
    signingProperties.load(new FileInputStream(signingPropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.socialemployee"
    defaultConfig {
        applicationId "com.socialemployee"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.1.1"
    }
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    // Windows caps file paths at 260 characters. The New Architecture's C++ build nests deep
    // folders under android/app/.cxx, and react-native-gesture-handler 3 runs past the cap from
    // this project's folder. On Windows the C++ build runs in a short folder instead.
    if (System.getProperty("os.name").toLowerCase().contains("windows")) {
        externalNativeBuild {
            cmake {
                buildStagingDirectory = new File(System.getProperty("user.home"), ".cxx/ss-employee")
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (signingPropertiesFile.exists()) {
                storeFile file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
