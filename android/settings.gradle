def modulesRoot = settings.hasProperty('extDir') ? extDir : '../ext/lib'
pluginManagement { includeBuild("${modulesRoot}/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'SocialEmployee'
include ':app'
includeBuild("${modulesRoot}/@react-native/gradle-plugin")
