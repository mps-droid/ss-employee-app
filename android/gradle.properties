org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true

# Architectures to build. Release builds should also include armeabi-v7a.
reactNativeArchitectures=arm64-v8a,x86_64

newArchEnabled=true

# Hermes is the default React Native JS engine (iOS already uses it).
hermesEnabled=true

# The React Native 0.77 Gradle plugin predates SDK 36; this silences the warning.
android.suppressUnsupportedCompileSdk=36
