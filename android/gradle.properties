org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true

# CPU architectures to build. All four go into release builds, so 32-bit phones
# can install the app. `npm run android` passes --active-arch-only, which builds
# just the connected device's architecture and keeps local builds fast.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

newArchEnabled=true

# Hermes is the JavaScript engine on both platforms.
hermesEnabled=true

# Draw behind the system bars (required from Android 16); screens add safe-area insets.
edgeToEdgeEnabled=true

# Opt out of built-in Kotlin and the new DSL that ship with AGP 9, as the
# React Native 0.88 template does. AGP 10 removes these opt-outs.
android.builtInKotlin=false
android.newDsl=false
